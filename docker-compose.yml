version: "3.9"

services:
  wms:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9000:9000"
    env_file:
      - .env
    environment:
      - WMS_DB_FILE=/data/weather_data.db
      - WMS_CSV_LOG_FILE=/data/sensor_log.csv
    volumes:
      - wms_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  wms_data:
    name: wms_data
